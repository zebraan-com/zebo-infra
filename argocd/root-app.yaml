apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: zebo-apps
  namespace: argocd
spec:
  generators:
  - git:
      repoURL: https://github.com/zebraan-com/zebo-infra.git
      revision: HEAD
      directories:
      - path: apps/*
  template:
    metadata:
      name: '{{path.basename}}-apps'
      namespace: argocd
    spec:
      project: default
      source:
        repoURL: https://github.com/zebraan-com/zebo-infra.git
        targetRevision: HEAD
        path: '{{path}}'
        directory:
          recurse: true
      destination:
        server: https://kubernetes.default.svc
        namespace: argocd
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
